name: Latest Build

# On push to main (or manual dispatch): build all platforms via the reusable
# build, then update the rolling "latest" Release. Versioned releases are
# handled by release.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: latest-build
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish Latest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update rolling "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HyperPrism Reimagined — Latest Build
          make_latest: true
          prerelease: false
          body: |
            # HyperPrism Reimagined — Latest Build

            Auto-published from the latest `main` commit
            (`${{ github.sha }}`). The `latest` tag itself is not moved; this commit is the
            one these downloads were built from. 32 audio effect plugins: VST3 on every
            platform, plus AU and Standalone on macOS.

            **Upgrading from v1.0.0:** v1.0.0 used a different manufacturer code. VST3 hosts that
            support plugin compatibility (for example Cubase and Nuendo) load these builds in
            place of v1.0.0 in saved sessions; other hosts, and AU, show the old plugin as
            missing, so insert the new one and re-apply its settings.

            > This rolling build always tracks the newest stable code on `main`.
            > For pinned, versioned downloads see the tagged releases.

            ## Downloads
            | Platform | Architecture | Notes |
            |----------|-------------|-------|
            | **macOS** | Universal Binary (arm64 + x86_64) | Apple Silicon + Intel |
            | **Windows** | x64 | Windows 10/11 |
            | **Linux** | x86_64 | Ubuntu 20.04+, Fedora, Arch |

            ## Installation
            1. Download and extract the zip for your platform
            2. Copy `.vst3` files to your VST3 plugin folder:
               - **macOS**: `~/Library/Audio/Plug-Ins/VST3/`
               - **Windows**: `C:\Program Files\Common Files\VST3\`
               - **Linux**: `~/.vst3/`
               On macOS also copy the `.component` files to `~/Library/Audio/Plug-Ins/Components/`
               (Logic Pro loads Audio Units only). Requires macOS 11.0 or later.
            3. Rescan plugins in your DAW

            **macOS Gatekeeper**: these builds are not notarized — if macOS blocks
            them, run `xattr -cr *.vst3 *.component` on the extracted plugins before installing.
          files: artifacts/**/*.zip
